name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            build_flag: --linux
            artifact_name: linux
          - os: windows-2022
            build_flag: --win
            artifact_name: windows
          - os: macos-14
            build_flag: --mac
            artifact_name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Bibliotheken und KI-Modell (nicht im Git, 135 MB) bereitstellen; Pruefsummen siehe scripts/vendor.lock.json
      - uses: actions/cache@v4
        with:
          path: |
            app/vendor
            app/models
          key: vendor-${{ hashFiles('scripts/vendor.lock.json') }}
      - run: npm run fetch-vendor
      - run: npx electron-builder ${{ matrix.build_flag }} --publish never
        continue-on-error: ${{ matrix.os == 'macos-14' || matrix.os == 'windows-2022' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: builds-${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: warn

  release:
    needs: [build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: builds-*
          merge-multiple: true
          path: dist
      - name: Alle Installer vorhanden?
        # Verhindert ein Release ohne Windows-Installer (der Download-Link auf der Website liefe sonst ins Leere).
        run: |
          for pattern in "PrivacyShield-Setup-*.exe" "PrivacyShield-*.zip" "PrivacyShield-*.AppImage" "PrivacyShield-*.deb"; do
            if ! compgen -G "dist/$pattern" > /dev/null; then
              echo "FEHLT: $pattern - Build-Job erneut ausfuehren, bevor das Release erstellt wird"
              exit 1
            fi
          done
      - name: Create Release
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          FILES=$(find dist -maxdepth 1 -type f | tr '\n' ' ' | xargs)
          if [ -z "$FILES" ]; then
            echo "Keine Dateien in dist/ — erstelle Release ohne Assets"
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "PrivacyShield $TAG"
          else
            echo "Dateien gefunden: $FILES"
            gh release create "$TAG" $FILES \
              --title "$TAG" \
              --notes "PrivacyShield $TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
