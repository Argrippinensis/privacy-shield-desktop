name: Build & Release

# Ein Tag vX.Y.Z baut alle Plattformen, testet jedes gebaute Programm und erstellt erst dann das Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      break_model:
        description: 'Probelauf: Modelldatei nach der Installation loeschen (Windows-Job muss mit klarer Meldung scheitern)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            build_flag: --linux
            artifact_name: linux
          - os: windows-2022
            build_flag: --win
            artifact_name: windows
          - os: macos-14
            build_flag: --mac
            artifact_name: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # Bibliotheken und KI-Modell (nicht im Git, 135 MB) bereitstellen; Pruefsummen siehe scripts/vendor.lock.json
      - uses: actions/cache@v6
        with:
          path: |
            app/vendor
            app/models
          key: vendor-${{ hashFiles('scripts/vendor.lock.json') }}
      - run: npm run fetch-vendor
      - run: npx electron-builder ${{ matrix.build_flag }} --publish never
      # Das gebaute (entpackte) Programm testen, bevor es in ein Release geht
      - name: Tests gegen das gebaute Programm
        shell: bash
        env:
          PS_SKIP_EVAL: '1'
        run: |
          case "$RUNNER_OS" in
            Linux)   BIN="$PWD/dist/linux-unpacked/privacy-shield-desktop"; PREFIX="xvfb-run -a" ;;
            Windows) BIN="$(cygpath -w "$PWD/dist/win-unpacked/PrivacyShield.exe")"; PREFIX="" ;;
            macOS)   BIN="$PWD/dist/mac-arm64/PrivacyShield.app/Contents/MacOS/PrivacyShield"; PREFIX="" ;;
          esac
          echo "Programm: $BIN"
          PS_PACKAGED_BIN="$BIN" $PREFIX npm test
      # Nur Windows: den echten Installer (NSIS, still) ausfuehren und die installierte App pruefen
      - name: Windows - Installer still installieren (C:\PS-Test)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $PWD 'dist\PrivacyShield-Setup.exe'
          if (-not (Test-Path $installer)) { throw "Installer fehlt: $installer" }
          # /D= muss das letzte Argument sein und darf nicht in Anfuehrungszeichen stehen
          $p = Start-Process -Wait -PassThru -FilePath $installer -ArgumentList '/S','/D=C:\PS-Test'
          if ($p.ExitCode -ne 0) { throw "Installer-Exitcode $($p.ExitCode)" }
          # NSIS-Nachlauf: die Datei kann kurz nach Ende des Installers noch fehlen, bis zu 30 s im 1-s-Takt warten
          $exe = 'C:\PS-Test\PrivacyShield.exe'
          for ($i = 0; $i -lt 30 -and -not (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $exe)) { throw "Installation fehlgeschlagen: $exe fehlt (auch nach 30 s)" }
      - name: Windows - Modelldatei der Installation pruefen
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BREAK_MODEL: ${{ inputs.break_model }}
        run: |
          $model = 'C:\PS-Test\resources\app.asar.unpacked\app\models\Xenova\distilbert-base-multilingual-cased-ner-hrl\onnx\model_quantized.onnx'
          # Probelauf der Pruefung: Datei absichtlich entfernen
          if ($env:BREAK_MODEL -eq 'true') {
            Write-Host 'break_model=true: Modelldatei wird geloescht, dieser Lauf muss scheitern'
            Remove-Item -Force -ErrorAction SilentlyContinue $model
          }
          if (-not (Test-Path $model)) { throw "KI-Modell fehlt in der Installation: $model" }
          $size = (Get-Item $model).Length
          if ($size -ne 135359829) { throw "KI-Modell in der Installation hat $size statt 135359829 Bytes: $model" }
          Write-Host "KI-Modell vollstaendig: $size Bytes"
      - name: Windows - Tests gegen die installierte App
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PS_PACKAGED_BIN: C:\PS-Test\PrivacyShield.exe
          PS_INSTALLED: '1'
          PS_SKIP_EVAL: '1'
        run: |
          node --test --test-concurrency=1 tests/installed.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'tests/installed.test.mjs fehlgeschlagen (installierte App unvollstaendig)' }
          node --test --test-concurrency=1 tests/ai-fehler.test.mjs tests/offline-ai.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'ai-fehler/offline-ai gegen die installierte App fehlgeschlagen' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: builds-${{ matrix.artifact_name }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.zip
            dist/*.zip.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
          if-no-files-found: warn

  release:
    # Nur fuer Tags: ein manueller Lauf (workflow_dispatch) auf einem Zweig baut und testet als Probelauf, ohne ein Release zu erstellen
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: builds-*
          merge-multiple: true
          path: dist
      - name: Tag, Version, Changelog und alle Installer pruefen
        run: node scripts/check-release-inputs.mjs "$GITHUB_REF_NAME"
      - name: Release-Text aus CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then echo "PrivacyShield ${GITHUB_REF_NAME}" > notes.md; fi
          cat notes.md
      - name: Pruefsummen erstellen
        run: |
          cd dist
          sha256sum PrivacyShield* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release als Entwurf mit Assets anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          FILES=$(find dist -maxdepth 1 -type f \( -name 'PrivacyShield*' -o -name 'latest*.yml' -o -name 'SHA256SUMS.txt' \) | tr '\n' ' ')
          echo "Dateien: $FILES"
          # shellcheck disable=SC2086
          # Tag mit '-' (z. B. v2.0.0-beta.1) = Vorabversion: wird als Prerelease angelegt und nie 'Latest'
          case "$GITHUB_REF_NAME" in
            *-*) gh release create "$GITHUB_REF_NAME" $FILES --draft --prerelease --title "PrivacyShield $GITHUB_REF_NAME (Vorabversion)" --notes-file notes.md ;;
            *) gh release create "$GITHUB_REF_NAME" $FILES --draft --title "PrivacyShield $GITHUB_REF_NAME" --notes-file notes.md ;;
          esac
      - name: Hochgeladene Dateien pruefen und Release veroeffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | select(.size > 0) | .name' > assets.txt
          for file in PrivacyShield-Setup.exe PrivacyShield-mac-arm64.zip PrivacyShield-mac-x64.zip PrivacyShield.AppImage PrivacyShield.deb SHA256SUMS.txt; do
            if ! grep -Fxq "$file" assets.txt; then
              echo "Release bleibt Entwurf: hochgeladene Datei fehlt oder ist leer: $file"
              exit 1
            fi
          done
          # Vorabversionen behalten das Prerelease-Flag beim Veroeffentlichen
          case "$GITHUB_REF_NAME" in
            *-*) gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease ;;
            *) gh release edit "$GITHUB_REF_NAME" --draft=false ;;
          esac
      - name: Download-Links pruefen
        # Stabil: Die Website verlinkt auf releases/latest/download/<fester Dateiname>; hier sicherstellen, dass sie funktionieren.
        # Vorabversion: Dateien ueber releases/download/<Tag>/ pruefen und sicherstellen, dass 'Latest' NICHT der neue Tag ist.
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*)
              for f in PrivacyShield-Setup.exe PrivacyShield-mac-arm64.zip PrivacyShield-mac-x64.zip PrivacyShield.AppImage PrivacyShield.deb SHA256SUMS.txt; do
                code=$(curl -sIL -o /dev/null -w "%{http_code}" "https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}/$f")
                echo "$f -> HTTP $code"
                [ "$code" = "200" ] || exit 1
              done
              LATEST=$(gh api "repos/${REPO}/releases/latest" --jq .tag_name 2>/dev/null || true)
              echo "Latest ist: ${LATEST:-(kein stabiles Release)}"
              [ "$LATEST" != "$GITHUB_REF_NAME" ] || { echo "Vorabversion ist faelschlich Latest"; exit 1; }
              ;;
            *)
              for f in PrivacyShield-Setup.exe PrivacyShield-mac-arm64.zip PrivacyShield-mac-x64.zip PrivacyShield.AppImage PrivacyShield.deb SHA256SUMS.txt; do
                code=$(curl -sIL -o /dev/null -w "%{http_code}" "https://github.com/${REPO}/releases/latest/download/$f")
                echo "$f -> HTTP $code"
                [ "$code" = "200" ] || exit 1
              done
              ;;
          esac
